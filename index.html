    <script>
      // This project is called pyodide-llm now. GitHub Pages does not forward the URLs of a renamed repository, so

      const rest = location.pathname.split("/").slice(2).join("/");
      location.replace("https://takano32.github.io/pyodide-llm/" + rest + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://takano32.github.io/pyodide-llm/" />
  </head>
